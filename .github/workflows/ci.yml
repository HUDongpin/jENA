name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: node scripts/bench.mjs
      - name: Consumer smoke test (packed tarball)
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/jena-js-*.tgz > /dev/null
          node --input-type=module -e "
            import { ena } from 'jena-js';
            const set = ena({
              rows: [
                { unit: 'u1', conv: 'c1', A: 1, B: 0, C: 1 },
                { unit: 'u1', conv: 'c1', A: 0, B: 1, C: 0 },
                { unit: 'u2', conv: 'c1', A: 1, B: 1, C: 0 }
              ],
              units: ['unit'], conversation: ['conv'], codes: ['A', 'B', 'C'], windowSizeBack: 2
            });
            if (set.points.length !== 2) throw new Error('unexpected point count');
            const total = Object.values(set.variance).reduce((a, b) => a + b, 0);
            if (Math.abs(total - 1) > 1e-9) throw new Error('variance shares must sum to 1');
            console.log('consumer smoke test OK');
          "

  browser:
    runs-on: ubuntu-latest
    name: Browser (Chromium)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
